# ============================================================
# 默认 opkg 源（会被 99-mirror-cn 脚本在首次启动时改写）
# 这里使用 iStoreOS 官方源作为初始值
# kmods 哈希使用 iStoreOS 24.10.5 对应的版本
# 若使用其他版本，请从 bin/targets/x86/64/kmods/ 目录名中读取实际哈希
# ============================================================
src/gz istoreos_core https://mirrors.cernet.edu.cn/openwrt/releases/24.10.5/targets/x86/64/packages
src/gz istoreos_base https://mirrors.cernet.edu.cn/openwrt/releases/24.10.5/packages/x86_64/base
src/gz istoreos_luci https://mirrors.cernet.edu.cn/openwrt/releases/24.10.5/packages/x86_64/luci
src/gz istoreos_packages https://mirrors.cernet.edu.cn/openwrt/releases/24.10.5/packages/x86_64/packages
src/gz istoreos_routing https://mirrors.cernet.edu.cn/openwrt/releases/24.10.5/packages/x86_64/routing
src/gz istoreos_telephony https://mirrors.cernet.edu.cn/openwrt/releases/24.10.5/packages/x86_64/telephony
# 注意：故意不包含 kmods 行，避免哈希版本不匹配
# 如果需要在容器内安装 kmod 包，运行 opkg update 时脚本会从 /rom 恢复真实哈希